<!DOCTYPE html>
<html>
<head>
<title>AI Assistant</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at top, #1e1e2f, #0f0f14);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", Arial, sans-serif;
}

/* Chat container */
#chat {
    width: 360px;
    background: rgba(20, 20, 30, 0.95);
    border-radius: 18px;
    padding: 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.08);
}

/* Title */
#chat h3 {
    margin: 0 0 12px;
    text-align: center;
    color: #ffffff;
    font-weight: 600;
    letter-spacing: 0.5px;
}

/* Messages area */
#messages {
    height: 300px;
    overflow-y: auto;
    padding: 10px;
    background: #0f0f1a;
    border-radius: 12px;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.6);
    color: #eaeaea;
    font-size: 14px;
}

/* Scrollbar */
#messages::-webkit-scrollbar {
    width: 6px;
}
#messages::-webkit-scrollbar-thumb {
    background: #444;
    border-radius: 10px;
}

/* User message */
#messages p b {
    color: #6cb6ff;
}

/* Input */
#input {
    width: calc(100% - 80px);
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 12px;
    border: none;
    outline: none;
    background: #1a1a2b;
    color: #fff;
    font-size: 14px;
    box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
}

/* Send button */
button {
    width: 60px;
    margin-left: 6px;
    padding: 10px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, #5f9cff, #7c6cff);
    color: white;
    font-weight: 600;
    box-shadow: 0 5px 15px rgba(95,156,255,0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(95,156,255,0.6);
}

button:active {
    transform: scale(0.96);
}
</style>
</head>
<body>
<div id="chat">
    <h3>AI Assistant</h3>
    <div id="messages"></div>
    <input id="input" placeholder="Ask something..." />
    <button onclick="send()">Send</button>
</div>



<script type = "module">

import {API_KEY,API_URL} from "./config.js";    

async function send() {
    const input = document.getElementById("input");
    const msg = input.value.trim();
    if (!msg) return;
    input.value = "";


    const messagesDiv = document.getElementById("messages");
    messagesDiv.innerHTML += `<p><b>You:</b> ${msg}</p>`;


    try {
        const res = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": API_KEY,
            },
            body: JSON.stringify({
                model: "mistralai/devstral-2512:free",
                messages: [
                    { role: "system", content: "You are the AI assistant of this page,owner os this page is shivam, shivam is tech creator, yutube channel: Technical vartal" },
                    { role: "user", content: msg }
                ]
            })
        });


        const data = await res.json();
        const reply = data.choices[0].message.content;


        messagesDiv.innerHTML += `<p><b>AI:</b> ${reply}</p>`;
    } catch (err) {
        messagesDiv.innerHTML += `<p style="color:red">Error connecting to AI</p>`;
    }
}

window.send = send;
</script>

</body>

</html>
